# PRIMARY Phase 1 / Q1 config. Every file comes from the same Zenodo record (corrected CICFlowMeter),
# so one extractor is used throughout. No corrected CSE-CIC-IDS2018 CSV is published, hence InSDN.
# Phase 1 / Q1: within-dataset vs cross-dataset gap, public data only.
# Train on corrected CIC-IDS2017 Mon-Wed, tune the decision threshold on Thu,
# test within-dataset on Fri, test cross-dataset on all of InSDN (a different SDN network).
# Days are quoted strings (YYYY-MM-DD) so YAML does not turn them into dates.
experiment_name: phase1_public_baseline
seeds: [0, 1, 2, 3, 4]          # >= 5 seeds for any reported number
tracking:
  # Local SQLite store (gitignored). Override with a running server if you have one.
  mlflow_uri: sqlite:///mlruns/mlflow.db
  experiment: securetrace-phase1
data:
  public_csv_paths:
    - data/raw/public/cic_ids_2017_corrected.csv
    - data/raw/public/insdn.csv
  label_col: Label
  day_col: Day                  # only used if a file has a Day column; otherwise parsed from Timestamp
  drop_attempted: true          # remove "... - Attempted" rows (ambiguous labels)
  train_days: ["2017-07-03", "2017-07-04", "2017-07-05"]
  val_days: ["2017-07-06"]
  test_days: ["2017-07-07"]                       # within-dataset test
  cross_datasets: {insdn: [insdn]}
  max_train_rows: 300000        # seeded random subsample so slow families stay comparable
metrics:
  recalls: [0.90, 0.95]
models:
  logreg: {C: 1.0}
  random_forest: {n_estimators: 150, min_samples_leaf: 2}
  xgboost: {n_estimators: 200, max_depth: 6, eta: 0.05}
  lightgbm: {n_estimators: 200, num_leaves: 63, eta: 0.05}
  mlp: {hidden: [128, 64], max_iter: 60}
